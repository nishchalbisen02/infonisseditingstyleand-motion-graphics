<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mg-duration" content="6">
<meta name="mg-size" content="1920x1080">
<meta name="mg-fps" content="30">
<title>Lower Third</title>
<!--
  Lower third: name + role strip for interviews, talking heads and reels.
  Params: name, role, accent (hex), panel (hex), text (hex), bg (hex)
  Overlay use: render with --alpha to get a transparent .mov
-->
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  :root {
    --u: calc(min(100vw, 177.78vh) / 100);
    --accent: #ff4d5e;
    --panel: #10131c;
    --text: #ffffff;
    --bg: #2a3142;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Poppins', sans-serif;
    background:
      radial-gradient(120% 90% at 70% 20%, color-mix(in srgb, var(--bg) 70%, #fff) 0%, var(--bg) 55%, color-mix(in srgb, var(--bg) 60%, #000) 100%);
  }
  html.alpha body { background: transparent; }

  .lt {
    position: absolute;
    left: calc(7 * var(--u));
    bottom: calc(11 * var(--u));
    display: flex;
    align-items: stretch;
    animation: lt-out 0.7s var(--ease-in) 5.1s forwards;
  }

  .bar {
    width: calc(0.55 * var(--u));
    background: var(--accent);
    transform-origin: bottom;
    animation: bar-in 0.5s var(--ease-out) 0s both;
  }

  .panel {
    position: relative;
    padding: calc(1.25 * var(--u)) calc(2.6 * var(--u)) calc(1.35 * var(--u)) calc(1.8 * var(--u));
    background: var(--panel);
    clip-path: inset(0 100% 0 0);
    animation: panel-in 0.8s var(--ease-out) 0.2s both;
  }
  .panel::after {
    content: '';
    position: absolute;
    left: calc(1.8 * var(--u));
    bottom: calc(0.75 * var(--u));
    height: calc(0.16 * var(--u));
    width: calc(5 * var(--u));
    background: var(--accent);
    transform-origin: left;
    animation: line-in 0.7s var(--ease-out) 0.95s both;
  }

  .mask {
    overflow: hidden;
    padding-block: 0.12em;
    margin-block: -0.12em;
  }
  .name {
    color: var(--text);
    font-weight: 800;
    font-size: calc(2.9 * var(--u));
    line-height: 1.25;
    letter-spacing: -0.01em;
    white-space: nowrap;
    animation: rise 0.75s var(--ease-out) 0.5s both;
  }
  .role {
    color: color-mix(in srgb, var(--text) 78%, transparent);
    font-weight: 400;
    font-size: calc(1.45 * var(--u));
    line-height: 1.4;
    margin-top: calc(0.2 * var(--u));
    padding-bottom: calc(0.6 * var(--u));
    white-space: nowrap;
    animation: rise 0.75s var(--ease-out) 0.68s both;
  }

  @keyframes bar-in { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes panel-in { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes line-in { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes rise { from { transform: translateY(110%); } to { transform: translateY(0); } }
  @keyframes lt-out {
    from { clip-path: inset(0 0 0 0); transform: translateX(0); }
    to { clip-path: inset(0 100% 0 0); transform: translateX(calc(-1.5 * var(--u))); }
  }
</style>
</head>
<body>
  <div class="lt">
    <div class="bar"></div>
    <div class="panel">
      <div class="mask"><div class="name" id="name"></div></div>
      <div class="mask"><div class="role" id="role"></div></div>
    </div>
  </div>

<script src="../assets/mg.js"></script>
<script>
  const p = mg.params({
    name: 'Your Name',
    role: 'Video Editor · Motion Designer',
    accent: '#ff4d5e',
    panel: '#10131c',
    text: '#ffffff',
    bg: '#2a3142',
  });
  document.getElementById('name').textContent = p.name;
  document.getElementById('role').textContent = p.role;
  const root = document.documentElement.style;
  for (const k of ['accent', 'panel', 'text', 'bg']) root.setProperty(`--${k}`, mg.color(p[k]));
</script>
</body>
</html>
