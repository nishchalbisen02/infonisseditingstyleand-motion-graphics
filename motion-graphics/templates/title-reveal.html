<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mg-duration" content="5">
<meta name="mg-size" content="1920x1080">
<meta name="mg-fps" content="30">
<title>Title Reveal</title>
<!--
  Title reveal: intro / chapter title with word-by-word rise, drawn ring and soft light.
  Params: title, subtitle, kicker, accent (hex), accent2 (hex), bg (hex)
  Works landscape (hd), vertical (--size reel) and square (--size square).
-->
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  :root {
    --u: calc(min(100vw, 100vh * 16 / 9) / 100);
    --accent: #ff4d5e;
    --accent2: #4d7cff;
    --bg: #0a0d16;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    color: #fff;
  }
  html.alpha body { background: transparent; }
  html.alpha .backdrop { display: none; }

  /* ---------- backdrop ---------- */
  .backdrop { position: absolute; inset: 0; overflow: hidden; }
  .glow {
    position: absolute;
    width: 70vmax; height: 70vmax;
    border-radius: 50%;
    opacity: 0.5;
  }
  .glow.a {
    background: radial-gradient(circle, var(--accent) 0%, transparent 65%);
    left: -20vmax; top: -25vmax;
    animation: drift-a 9s ease-in-out infinite alternate, fade-in 1.4s ease-out both;
  }
  .glow.b {
    background: radial-gradient(circle, var(--accent2) 0%, transparent 65%);
    right: -25vmax; bottom: -30vmax;
    animation: drift-b 11s ease-in-out infinite alternate, fade-in 1.4s ease-out 0.2s both;
  }
  .grid {
    position: absolute; inset: -10%;
    background-image:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: calc(6 * var(--u)) calc(6 * var(--u));
    mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%);
    animation: grid-pan 12s linear infinite, fade-in 1.2s ease-out both;
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.55) 100%);
  }

  /* ---------- content ---------- */
  .stage {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    animation: stage-out 0.8s var(--ease-in) 4.2s forwards;
  }
  .ring {
    position: absolute;
    width: calc(54 * var(--u)); height: calc(54 * var(--u));
    max-width: 88vw; max-height: 88vw;
    overflow: visible;
  }
  .ring circle {
    fill: none;
    stroke-linecap: round;
  }
  .ring .r1 {
    stroke: var(--accent);
    stroke-width: 0.6;
    stroke-dasharray: 302;
    stroke-dashoffset: 302;
    animation: draw 1.6s var(--ease-out) 0.15s forwards, spin 14s linear infinite;
    transform-origin: 50% 50%;
  }
  .ring .r2 {
    stroke: rgba(255,255,255,0.18);
    stroke-width: 0.25;
    stroke-dasharray: 2 4;
    animation: spin-rev 22s linear infinite, fade-in 1.2s ease-out 0.4s both;
    transform-origin: 50% 50%;
  }

  .copy {
    position: relative;
    text-align: center;
    padding: 0 6vw;
    max-width: min(100vw, calc(48 * var(--u)) + 12vw);
  }
  .kicker {
    display: inline-block;
    font-weight: 600;
    font-size: calc(1.15 * var(--u));
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: calc(1.4 * var(--u));
    animation: fade-up 0.9s var(--ease-out) 0.3s both;
  }
  .title {
    font-weight: 800;
    font-size: calc(5.6 * var(--u));
    line-height: 1.2;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .word {
    display: inline-block;
    overflow: hidden;
    vertical-align: top;
    padding: 0.14em 0.04em 0.2em;
    margin: -0.14em -0.04em -0.2em;
  }
  .word > span {
    display: inline-block;
    animation: word-rise 1s var(--ease-out) both;
  }
  .rule {
    width: calc(9 * var(--u));
    height: calc(0.32 * var(--u));
    margin: calc(2.2 * var(--u)) auto calc(1.8 * var(--u));
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transform-origin: center;
    animation: grow 0.9s var(--ease-out) 1.1s both;
  }
  .subtitle {
    font-weight: 400;
    font-size: calc(1.9 * var(--u));
    line-height: 1.5;
    color: rgba(255,255,255,0.78);
    animation: fade-up 0.9s var(--ease-out) 1.3s both;
  }

  /* Vertical / square formats: bigger type relative to width */
  @media (max-aspect-ratio: 1/1) {
    :root { --u: calc(100vw / 56); }
    .ring { width: 86vw; height: 86vw; }
    .copy { max-width: 100vw; padding: 0 14vw; }
    .title { font-size: calc(6 * var(--u)); }
  }

  @keyframes word-rise {
    from { transform: translateY(105%) rotate(4deg); filter: blur(6px); }
    to { transform: translateY(0) rotate(0); filter: blur(0); }
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(calc(1.6 * var(--u))); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade-in { from { opacity: 0; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spin-rev { to { transform: rotate(-360deg); } }
  @keyframes drift-a { to { transform: translate(12vmax, 8vmax) scale(1.1); } }
  @keyframes drift-b { to { transform: translate(-10vmax, -6vmax) scale(1.15); } }
  @keyframes grid-pan { to { transform: translate(calc(6 * var(--u)), calc(6 * var(--u))); } }
  @keyframes stage-out {
    to { opacity: 0; transform: scale(1.06); filter: blur(8px); }
  }
</style>
</head>
<body>
  <div class="backdrop">
    <div class="glow a"></div>
    <div class="glow b"></div>
    <div class="grid"></div>
    <div class="vignette"></div>
  </div>

  <div class="stage">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="r2" cx="50" cy="50" r="49"></circle>
      <circle class="r1" cx="50" cy="50" r="48"></circle>
    </svg>
    <div class="copy">
      <div class="kicker" id="kicker"></div>
      <h1 class="title" id="title"></h1>
      <div class="rule"></div>
      <div class="subtitle" id="subtitle"></div>
    </div>
  </div>

<script src="../assets/mg.js"></script>
<script>
  const p = mg.params({
    kicker: 'Episode 01',
    title: 'Your Title Goes Here',
    subtitle: 'A short line that sets up the story',
    accent: '#ff4d5e',
    accent2: '#4d7cff',
    bg: '#0a0d16',
  });
  const kicker = document.getElementById('kicker');
  if (p.kicker) kicker.textContent = p.kicker; else kicker.remove();
  const title = document.getElementById('title');
  title.textContent = p.title;
  mg.splitWords(title, { start: 0.45, stagger: 0.09 });
  document.getElementById('subtitle').textContent = p.subtitle;
  const root = document.documentElement.style;
  for (const k of ['accent', 'accent2', 'bg']) root.setProperty(`--${k}`, mg.color(p[k]));
</script>
</body>
</html>
